<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All courses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-['Montserrat']">
    <div class="section-1 w-full py-[64px] bg-[#EEF4F6] min-h-screen">
      <div
        class="container px-3.5 md:px-0 sm:py-0 md:w-full md:py-0 lg:w-full mx-auto relative"
      >
        <a
          href="/"
          class="flex w-fit items-center gap-2 text-sm text-[#6B7A8C] mb-6"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M10.0003 15.8333L4.16699 10L10.0003 4.16667"
              stroke="#023047"
              stroke-width="1.66667"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15.8337 10H4.16699"
              stroke="#023047"
              stroke-width="1.66667"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="text-[#023047]">На главную</span>
        </a>

        <h1 class="text-[28px] md:text-[32px] font-semibold mb-8">
          Наши курсы
        </h1>
        <div class="w-full flex flex-wrap items-start justify-between gap-6">
          <!-- Левая колонка: фильтры -->
          <aside class="w-full bg-white rounded-[16px] p-5 md:p-6 shadow-sm">
            <form class="w-full flex flex-wrap items-end gap-4">
              <div class="min-w-[210px] flex-1">
                <label
                  class="block text-[12px] font-semibold text-[#6B7A8C] mb-2 uppercase tracking-wide"
                >
                  Язык обучения
                </label>
                <select
                  class="w-full rounded-[10px] border border-[#E5E7EB] bg-white px-4 py-2 text-[14px] text-[#1F2A37] outline-none focus:border-[#FF9F1C] focus:ring-1 focus:ring-[#FF9F1C]/30"
                >
                  <option>Все языки</option>
                  <option>Казахский</option>
                  <option>Русский</option>
                  <option>Английский</option>
                </select>
              </div>

              <div class="min-w-[210px] flex-1">
                <label
                  class="block text-[12px] font-semibold text-[#6B7A8C] mb-2 uppercase tracking-wide"
                >
                  Формат курса
                </label>
                <select
                  class="w-full rounded-[10px] border border-[#E5E7EB] bg-white px-4 py-2 text-[14px] text-[#1F2A37] outline-none focus:border-[#FF9F1C] focus:ring-1 focus:ring-[#FF9F1C]/30"
                >
                  <option>Все форматы</option>
                  <option>Онлайн</option>
                  <option>Оффлайн</option>
                  <option>Смешанный</option>
                </select>
              </div>

              <div class="min-w-[210px] flex-1">
                <label
                  class="block text-[12px] font-semibold text-[#6B7A8C] mb-2 uppercase tracking-wide"
                >
                  Месяц
                </label>
                <select
                  class="w-full rounded-[10px] border border-[#E5E7EB] bg-white px-4 py-2 text-[14px] text-[#1F2A37] outline-none focus:border-[#FF9F1C] focus:ring-1 focus:ring-[#FF9F1C]/30"
                >
                  <option>Все месяцы</option>
                  <option>Март</option>
                  <option>Апрель</option>
                </select>
              </div>

              <div class="min-w-[210px] flex-1">
                <label
                  class="block text-[12px] font-semibold text-[#6B7A8C] mb-2 uppercase tracking-wide"
                >
                  Для кого
                </label>
                <select
                  class="w-full rounded-[10px] border border-[#E5E7EB] bg-white px-4 py-2 text-[14px] text-[#1F2A37] outline-none focus:border-[#FF9F1C] focus:ring-1 focus:ring-[#FF9F1C]/30"
                >
                  <option>Для всех</option>
                  <option>Директор</option>
                  <option>Заместитель директора</option>
                  <option>Методист</option>
                </select>
              </div>
            </form>
          </aside>

          <!-- Правая колонка: список курсов -->
          <main class="flex-1 min-w-[260px]">
            <div
              id="courses-list"
              class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
            ></div>
          </main>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const courses = [
          {
            image: "images/photo/7.png",
            type: "Курс",
            title: "Личное лидерство и ценностные ориентации",
            hours: "24 ак. ч.",
            group: "Группа: 5",
          },
          {
            image: "images/photo/8.png",
            type: "Модуль",
            title: "Эффективные коммуникации с населением и командой",
            hours: "24 ак. ч.",
            group: "Группа: 5",
          },
          {
            image: "images/photo/9.png",
            type: "Курс",
            title: "Управление развитием регионов и местных сообществ",
            hours: "24 ак. ч.",
            group: "Группа: 5",
          },
          {
            image: "images/photo/10.png",
            type: "Модуль",
            title:
              "Политические кампании: от позиционирования к доверию и поддержке",
            hours: "24 ак. ч.",
            group: "Группа: 5",
          },
          {
            image: "images/photo/11.png",
            type: "Курс",
            title:
              "Налоги для развития: от базы поступлений к результату на местах",
            hours: "32 ак. ч.",
            group: "Группа: 3",
          },
          {
            image: "images/photo/12.png",
            type: "Модуль",
            title:
              "Модульная программа обучения по развитию функциональных компетенций руководителей и кадрового актива местного государственного управления и общественно-политических организаций",
            hours: "20 ак. ч.",
            group: "Группа: 4",
          },
        ];

        const coursesList = document.getElementById("courses-list");
        if (coursesList) {
          coursesList.innerHTML = courses
            .map(
              (course) => `
              <article class="w-full bg-white rounded-[16px] overflow-hidden shadow-sm flex flex-col h-full">
                <img
                  src="${course.image}"
                  alt="${course.title}"
                  class="w-full h-[160px] md:h-[170px] object-cover" />

                <div class="px-5 py-5 md:px-6 flex flex-col gap-4 flex-1">
                  <h2 class="text-[20px] font-bold leading-[1.35]">
                    ${course.title}
                  </h2>

                  <div class="flex items-center gap-3 flex-wrap pb-6">
                    <div class="px-3 py-1 rounded-[8px] border border-[#C7EBF6] bg-[#E8F7FC] text-[14px] font-medium shadow-md>
                      ${course.type}
                    </div>
                    <div class="px-3 py-1 rounded-[8px] border border-[#C7EBF6] bg-[#E8F7FC] text-[14px] font-medium shadow-md>
                      ${course.hours}
                    </div>
                    <div class="px-3 py-1 rounded-[8px] border border-[#586E84] bg-[#F9FAFB] text-[14px] font-medium shadow-md">
                      ${course.group}
                    </div>
                  </div>

                  <div class="flex flex-col gap-3 mt-auto">
                    <button
                      class="cursor-pointer w-full py-2 rounded-[10px] [background:linear-gradient(45deg,_#FB8500_0%,_#FFB703_100%)] text-white text-[14px] font-semibold">
                      Подать заявку
                    </button>

                    <a
                      href="about-course.html"
                      class="text-[12px] text-center mt-3 text-[#FF9F1C] font-medium border-b border-[#FF9F1C] w-fit mx-auto">
                      Подробнее <span aria-hidden="true">→</span>
                    </a>
                  </div>
                </div>
              </article>
            `,
            )
            .join("");
        }
      });
    </script>
  </body>
</html>
